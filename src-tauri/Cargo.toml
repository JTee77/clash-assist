[package]
name = "clash-assist"
version = "0.2.8"
license = "GPL-3.0-or-later"
description = "Clash Assist (Clash伴侣) — macOS Apple Silicon proxy egress diagnostics"
authors = ["JTee77"]
edition = "2021"

[lib]
name = "clash_assist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
futures-util = "0.3"
# 流式下载的按块空闲超时（tauri 运行时即 tokio，这里只取 time 能力）
tokio = { version = "1", default-features = false, features = ["time"] }
sys-locale = "0.3"
# 自更新：按 WHATWG 规则解析并精确比对 Release 下载地址（替代前缀匹配）。
url = "2"
# 自更新：进程内计算 DMG SHA-256（不再依赖 /usr/bin/shasum）。
sha2 = "0.10"
# 打开 release 页面：macOS `/usr/bin/open --`、Windows ShellExecuteExW，不经 shell 解析。
open = { version = "5", features = ["shellexecute-on-windows"] }

[target.'cfg(unix)'.dependencies]
# CLI：Ctrl+C / SIGTERM 时先切回原节点再退出（sigaction / write / _exit）。
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
