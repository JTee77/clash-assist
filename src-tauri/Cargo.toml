[package]
name = "clash-assist"
version = "0.2.0"
license = "GPL-3.0-or-later"
description = "Clash Assist (Clash伴侣) — macOS Apple Silicon proxy egress diagnostics"
authors = ["JTee77"]
edition = "2021"

[lib]
name = "clash_assist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
futures-util = "0.3"
sys-locale = "0.3"

[target.'cfg(unix)'.dependencies]
# CLI：Ctrl+C / SIGTERM 时先切回原节点再退出（sigaction / write / _exit）。
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
