# clippy 配置骨架（windows-plan r4 §2.1「强制手段（M-2）」，清单按 S-R1 补全，PR #46 r2 扩充）。
#
# 背景（V3）：对命名管道名调用下列按路径打开 / 探测 / 写入的 API，会经 CreateFileW 以默认 QoS
#（不带 SQOS，可被模拟）真正打开管道。主要手段是 `PipeName` newtype 类型约束（M1，S-R1），
# 这里是补充手段。
#
# allow 规则（PR #46 评审 MF-1 / SR2-1 之后）：
# - 模块级 `#![allow(clippy::disallowed_methods)]` 只保留在 `cli_shim.rs`：整个模块只在非 Windows
#   编译（lib.rs `#[cfg(not(windows))]`），写永久 reason。`update_check.rs` 已在 M1 迁到 `safe_fs`
#   （S-R1 DoD），不再有 allow；M5 拆分 `update_check/` 时新增的 Windows 代码同样只走 `safe_fs`。
#   其他地方只允许语句级 / 函数级 allow，并写 reason。
# - 语句级 allow 只能加在 `let` 或不带块的单条表达式语句（如 `std::fs::copy(..)?;`）上，
#   只覆盖这一次调用：
#   `#[allow(..., reason = "...")] let is_dir = path.is_dir(); if is_dir { … }`；
#   不得加在 if / 块语句上（会覆盖整个 if 体）。（PR #46 r3 S-5）
# - reason：M1 之后 Windows 上会编译的代码不再有「M1 待迁移」的 allow（S-R1 DoD 已完成；唯一的
#   Windows 例外是 `safe_fs` 内部的安全打开封装）；只在 Unix / macOS 编译的写永久理由
#  （不在 S-R1 的 Windows 风险面）。
# - `mihomo/pipe.rs`、`mihomo/discovery.rs`、`mihomo/transport.rs` 的 Windows 分支不得添加 allow。
# - 第三方 crate 内部的调用 clippy 管不到，由类型约束兜底。
#
# CI 在 macos-14 与 windows-2022 上执行 `cargo clippy --all-targets -- -D warnings`。

disallowed-methods = [
  # std::path::Path::{exists, try_exists, metadata, symlink_metadata, is_file, is_dir}
  { path = "std::path::Path::exists", reason = "按路径探测会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "std::path::Path::try_exists", reason = "按路径探测会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "std::path::Path::metadata", reason = "按路径探测会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "std::path::Path::symlink_metadata", reason = "按路径探测会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "std::path::Path::is_file", reason = "按路径探测会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "std::path::Path::is_dir", reason = "按路径探测会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },

  # std::fs::{metadata, symlink_metadata, read, read_to_string, File::open, OpenOptions::open}
  { path = "std::fs::metadata", reason = "按路径打开会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "std::fs::symlink_metadata", reason = "按路径打开会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "std::fs::read", reason = "按路径打开会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "std::fs::read_to_string", reason = "按路径打开会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "std::fs::File::open", reason = "按路径打开会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "std::fs::OpenOptions::open", reason = "按路径打开会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },

  # PR #46 r2 扩充：std::fs::{write, File::create, File::create_new, canonicalize, copy}、Path::canonicalize
  { path = "std::fs::write", reason = "按路径写入 / 创建会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "std::fs::File::create", reason = "按路径写入 / 创建会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "std::fs::File::create_new", reason = "按路径写入 / 创建会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "std::fs::canonicalize", reason = "规范化路径会按路径打开目标（含命名管道，默认 QoS，V3）；管道只能经 pipe::open_verified" },
  { path = "std::path::Path::canonicalize", reason = "规范化路径会按路径打开目标（含命名管道，默认 QoS，V3）；管道只能经 pipe::open_verified" },
  { path = "std::fs::copy", reason = "复制会按路径打开源和目标（含命名管道，默认 QoS，V3）；管道只能经 pipe::open_verified" },

  # PR #46 r3 S-1 补全：std::fs::{exists, read_link}、Path::{is_symlink, read_link}、tokio::fs::read_link
  { path = "std::fs::exists", reason = "按路径探测会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "std::path::Path::is_symlink", reason = "按路径探测（symlink_metadata）会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "std::fs::read_link", reason = "按路径打开会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "std::path::Path::read_link", reason = "按路径打开会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },

  # tokio::fs::{metadata, symlink_metadata, read, read_to_string, try_exists, File::open, OpenOptions::open}
  { path = "tokio::fs::metadata", reason = "按路径打开会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "tokio::fs::symlink_metadata", reason = "按路径打开会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "tokio::fs::read", reason = "按路径打开会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "tokio::fs::read_to_string", reason = "按路径打开会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "tokio::fs::try_exists", reason = "按路径探测会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "tokio::fs::File::open", reason = "按路径打开会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "tokio::fs::OpenOptions::open", reason = "按路径打开会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },

  # PR #46 r2 扩充：tokio::fs::{write, File::create, File::create_new, canonicalize, copy}
  { path = "tokio::fs::write", reason = "按路径写入 / 创建会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "tokio::fs::File::create", reason = "按路径写入 / 创建会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "tokio::fs::File::create_new", reason = "按路径写入 / 创建会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
  { path = "tokio::fs::canonicalize", reason = "规范化路径会按路径打开目标（含命名管道，默认 QoS，V3）；管道只能经 pipe::open_verified" },
  { path = "tokio::fs::copy", reason = "复制会按路径打开源和目标（含命名管道，默认 QoS，V3）；管道只能经 pipe::open_verified" },
  { path = "tokio::fs::read_link", reason = "按路径打开会以默认 QoS 打开命名管道（V3）；管道只能经 pipe::open_verified" },
]
