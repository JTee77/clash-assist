name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发：Windows 里程碑分支在开 PR 之前用 `gh workflow run ci.yml --ref <分支>` 跑 CI
  workflow_dispatch:

# 默认只读（windows-plan r4 §2.8 / §3）；各 job 不再额外授权。
permissions:
  contents: read

jobs:
  # 供应链与版本检查（S-8 ②④、S-9）：不跑仓库依赖，只用 runner 自带的 bash / node / python3（含 python3-yaml）。
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: action 固定到 commit SHA、禁用高危触发器
        run: |
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
          bash scripts/check-workflow-pins.sh

      - name: pins 检查自测（正例 + 绕过反例）
        run: bash scripts/test-check-workflow-pins.sh

      - name: 版本一致性（package.json / Cargo.toml / tauri.conf.json）
        run: node scripts/check-version-sync.mjs

  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-15：受支持的 macOS arm64 镜像（macos-14 于 2026-11-02 退役）；windows-2022：Windows x64（x86_64-pc-windows-msvc）
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    # Windows 上 Rust 冷编译明显慢于 macOS
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # 按 rust-toolchain.toml 固定的版本安装（含 clippy），不依赖 runner 预装的 stable
      - name: Rust 工具链（rust-toolchain.toml）
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component clippy
          rustc --version
          cargo clippy --version

      # pnpm 写精确版本（S-8 ③）；仍不加 packageManager 字段——pnpm 12 会把自身 vendored 进 lockfile
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.16.1

      # PR 构建保留 pnpm 缓存：缓存按 ref 隔离，不会污染 release（S-8 ⑥）
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: 前端测试（vitest）
        run: pnpm install --frozen-lockfile && pnpm test

      - name: 类型检查
        run: pnpm typecheck

      - name: 后端测试（cargo test 全量）
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # V11（windows-plan §2.7）：编出 GUI 可执行文件，用 Windows SDK 的 mt.exe 导出内嵌应用清单，
      # 断言声明了 Per-Monitor v2 DPI 感知、保留 Common Controls v6、显式 asInvoker（src-tauri/windows/app.manifest，build.rs 嵌入）。
      - name: DPI 清单检查（mt.exe，V11）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --locked --bin clash-assist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $PWD 'src-tauri/target/debug/clash-assist.exe'
          if (-not (Test-Path $exe)) { Write-Error "找不到 $exe"; exit 1 }
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $mt = @(Get-ChildItem -Path $kits -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' -and (Test-Path (Join-Path $_.FullName 'x64/mt.exe')) } |
              Sort-Object { [version]$_.Name } -Descending |
              ForEach-Object { Join-Path $_.FullName 'x64/mt.exe' })
          if ($mt.Count -eq 0) { Write-Error "在 $kits 下找不到 x64/mt.exe"; exit 1 }
          Write-Host "mt.exe: $($mt[0])"
          $out = Join-Path $env:RUNNER_TEMP 'clash-assist.manifest'
          & $mt[0] -nologo "-inputresource:$exe;#1" "-out:$out"
          if ($LASTEXITCODE -ne 0) { Write-Error "mt.exe 导出清单失败（$LASTEXITCODE）"; exit 1 }
          Get-Content -Raw $out
          [xml]$doc = Get-Content -Raw $out
          $aware = @($doc.SelectNodes("//*[local-name()='dpiAwareness']") | ForEach-Object { $_.InnerText })
          if ($aware.Count -ne 1) { Write-Error "清单里应恰有一个 dpiAwareness，实际 $($aware.Count) 个"; exit 1 }
          $first = ($aware[0] -split ',')[0].Trim()
          if ($first -ne 'PerMonitorV2') { Write-Error "dpiAwareness 首选项应为 PerMonitorV2，实际：$($aware[0])"; exit 1 }
          $legacy = @($doc.SelectNodes("//*[local-name()='dpiAware']") | ForEach-Object { $_.InnerText.Trim() })
          if ($legacy.Count -ne 1 -or $legacy[0] -ne 'true/pm') { Write-Error "旧系统兜底的 dpiAware 应为 true/pm，实际：$($legacy -join ' | ')"; exit 1 }
          # tauri-build 默认清单只有这一项依赖（对话框需要），自定义清单必须保留
          $cc = @($doc.SelectNodes("//*[local-name()='dependentAssembly']/*[local-name()='assemblyIdentity' and @name='Microsoft.Windows.Common-Controls' and @version='6.0.0.0' and @publicKeyToken='6595b64144ccf1df']"))
          if ($cc.Count -ne 1) { Write-Error "清单缺少 Common Controls v6 依赖（Microsoft.Windows.Common-Controls 6.0.0.0 / 6595b64144ccf1df）"; exit 1 }
          # 显式 asInvoker（PR52）：恰一个 requestedExecutionLevel，level=asInvoker、uiAccess=false
          $lvl = @($doc.SelectNodes("//*[local-name()='trustInfo']//*[local-name()='requestedExecutionLevel']"))
          if ($lvl.Count -ne 1 -or $lvl[0].GetAttribute('level') -ne 'asInvoker' -or $lvl[0].GetAttribute('uiAccess') -ne 'false') { Write-Error "清单应恰有一个 requestedExecutionLevel level=asInvoker uiAccess=false，实际 $($lvl.Count) 个"; exit 1 }
          Write-Host "V11 通过：dpiAwareness = $($aware[0])；dpiAware = $($legacy[0])；Common Controls v6 依赖存在；asInvoker"

      # clippy.toml 的 disallowed-methods（M-2 / S-R1）：两个平台、含测试代码都必须零告警
      - name: clippy（--all-targets -D warnings）
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  # MUST-4（Ellie V5 复跑复核 §2-4、§2-11）：跨用户 S-D′ 回放与规则 4 的 token-mismatch / unverified。
  # 客户端是 M1 生产代码（src-tauri/src/mihomo/xuser_replay_tests.rs 中平时忽略的测试），以标准用户
  # ca_a 身份运行；ca_a / ca_b 由 scripts/ci-standard-users.ps1 临时创建（口令只在内存 / DPAPI 中）。
  # 不使用任何 secret。
  xuser-windows:
    runs-on: windows-2022
    # 冷编译 + 回放；计划任务的 ExecutionTimeLimit 为 30 分钟（ci-standard-users.ps1）
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Rust 工具链（rust-toolchain.toml）
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel *= *"(.*)"$').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version

      # 单独一步：编译失败时不进入回放。只编 lib 的测试二进制，从 cargo 的 JSON 输出取路径
      - name: 编译测试二进制（clash_assist_lib）
        run: |
          $lines = cargo test --manifest-path src-tauri/Cargo.toml --lib --locked --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = @($lines | ForEach-Object { try { $_ | ConvertFrom-Json } catch { } } |
              Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'clash_assist_lib' -and $_.profile.test -and $_.executable } |
              ForEach-Object { $_.executable } | Select-Object -Unique)
          if ($exe.Count -ne 1) { Write-Error "应恰有一个 clash_assist_lib 测试二进制，实际 $($exe.Count) 个"; exit 1 }
          & $exe[0] --list --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CLIENT_EXE=$($exe[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 跨用户回放（S-D′ + token-mismatch / unverified）
        run: |
          & ./scripts/ci-m1-xuser-replay.ps1 -ClientExe $env:CLIENT_EXE -ResultsDir (Join-Path $env:RUNNER_TEMP 'm1-xuser-results')
          exit $LASTEXITCODE

      # 兜底清理（回放脚本的 finally 已做过一次；可重复执行）。配置文件“正在使用”在 runner 上偶发，
      # 所以以“用户与计划任务都已删除”为准判定成败
      - name: 清理标准用户与计划任务
        if: always()
        run: |
          Get-Process -Name verge-mihomo, ca-m1-client -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction Continue
          & ./scripts/ci-standard-users.ps1 -Action Cleanup -UserName ca_a, ca_b
          $code = $LASTEXITCODE
          $users = @(Get-LocalUser -ErrorAction SilentlyContinue | Where-Object { $_.Name -in @('ca_a', 'ca_b') })
          $tasks = @(Get-ScheduledTask -ErrorAction SilentlyContinue | Where-Object { $_.TaskName -like 'ca-spike-*' })
          if ($users.Count -gt 0 -or $tasks.Count -gt 0) {
            Write-Error "清理不完整：用户 $($users.Name -join ',')；计划任务 $($tasks.TaskName -join ',')（Cleanup 退出码 $code）"
            exit 1
          }
          if ($code -ne 0) { Write-Warning "Cleanup 退出码 $code，但用户与计划任务均已删除" }
          exit 0

      # 只上传结果目录（results.json 与各作业的输出）；禁止上传 ci-standard-users 的状态目录（含 DPAPI 凭据）
      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m1-xuser-results
          path: ${{ runner.temp }}/m1-xuser-results
          if-no-files-found: warn
          retention-days: 7
