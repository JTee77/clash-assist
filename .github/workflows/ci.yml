name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 项目仅支持 macOS arm64；公开仓库的 macOS runner 免费额度不受限
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 与本地 pnpm 12 对齐（不加 packageManager 字段——pnpm 12 会把自身 vendored 进 lockfile）
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 前端测试（vitest 296 用例）
        run: pnpm install --frozen-lockfile && pnpm test

      - name: 类型检查
        run: pnpm typecheck

      - name: 后端测试（cargo test 全量）
        run: cargo test --manifest-path src-tauri/Cargo.toml
